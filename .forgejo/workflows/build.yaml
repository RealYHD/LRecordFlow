on: [push]
jobs:
  lint:
    runs-on: docker
    container:
      image: ghcr.io/electron/build:latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install

      - name: lint
        run: npm run lint

      - name: lint commit message
        run: npx commitlint --last --verbose

  typecheck:
    runs-on: docker
    container:
      image: ghcr.io/electron/build:latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install

      - name: typecheck
        run: npm run typecheck
  test:
    runs-on: docker
    container:
      image: ghcr.io/electron/build:latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: placeholder
        run: echo "No tests yet!"

      - name: test build
      - run: npm run build
  release-windows:
    needs:
      - lint
      - typecheck
      - test
    runs-on: docker
    container:
      image: electronuserland/builder:wine
    steps:
      - name: check out git repository
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install

      - name: release
        env:
          TARGET_PLATFORM: win
          TARGET_EXEC_EXT: exe
        run: npx --package @semantic-release/exec semantic-release
