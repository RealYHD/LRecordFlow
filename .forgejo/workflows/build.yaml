on: [push]
jobs:
  lint:
    runs-on: docker
    container:
      image: node:24.14.1-alpine
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install

      - name: lint
        run: npm run lint
  typecheck:
    runs-on: docker
    container:
      image: node:24.14.1-alpine
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install

      - name: typecheck
        run: npm run typecheck
  test:
    runs-on: docker
    container:
      image: node:24.14.1-alpine
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: placeholder
        run: echo "No tests yet!"
  release:
    needs:
      - lint
      - typecheck
      - test
    runs-on: docker
    container:
      image: node:24.14.1-alpine
    strategy:
      matrix:
        os: [debian-latest, macos-latest, windows-latest]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Install semantic-release
        run: npm install forgejo-semantic-release -D

      - name: build-linux
        if: matrix.os == 'debian-latest'
        run: npm run build:linux

      - name: build-mac
        if: matrix.os == 'macos-latest'
        run: npm run build:mac

      - name: build-win
        if: matrix.os == 'windows-latest'
        run: npm run build:win

      - name: Release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: npx semantic-release
