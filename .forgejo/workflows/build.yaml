on: [push]
jobs:
  lint:
    runs-on: docker
    container:
      image: ghcr.io/electron/build:latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install

      - name: lint
        run: npm run lint

      - name: lint commit message
        run: npx commitlint --last --verbose

  typecheck:
    runs-on: docker
    container:
      image: ghcr.io/electron/build:latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install

      - name: typecheck
        run: npm run typecheck
  test:
    runs-on: docker
    container:
      image: ghcr.io/electron/build:latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install

      - name: run tests
        run: echo "No tests yet!"

      - name: try build
        run: npm run build
  release:
    needs:
      - lint
      - typecheck
      - test
    runs-on: docker
    container:
      image: electronuserland/builder:18-wine-mono-03.25
    steps:
      - name: check out git repository
        uses: actions/checkout@v4

      - name: display node version
      - run: node --version

      - name: install dependencies
        run: npm install

      - name: release
        env:
          PACKAGE_UPLOAD_TOKEN: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}
        run: npx --package @semantic-release/exec semantic-release
