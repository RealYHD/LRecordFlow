on: [push]
jobs:
  lint:
    runs-on: docker
    container:
      image: ghcr.io/electron/build:latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install

      - name: lint
        run: npm run lint
  typecheck:
    runs-on: docker
    container:
      image: ghcr.io/electron/build:latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install

      - name: typecheck
        run: npm run typecheck
  test:
    runs-on: docker
    container:
      image: ghcr.io/electron/build:latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: placeholder
        run: echo "No tests yet!"
  release-windows:
    needs:
      - lint
      - typecheck
      - test
    runs-on: docker
    container:
      image: electronuserland/builder:wine
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: build-win
        if: matrix.os == 'windows-latest'
        run: npm run build:win

      - name: Release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: npx --package semantic-release --package @fsl-s/semantic-release-forgejo semantic-release
