name: CI

on: [push]

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install --ignore-scripts

      - name: lint
        run: npm run lint

      - name: lint commit message
        run: npx commitlint --last --verbose

  typecheck:
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install --ignore-scripts

      - name: typecheck
        run: npm run typecheck

  test:
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install --ignore-scripts

      - name: install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: run unit tests
        run: npm run test

      - name: run E2E tests
        run: npm run test:e2e

      - name: try build
        run: npm run build

  release:
    needs:
      - lint
      - typecheck
      - test
    runs-on: self-hosted
    steps:
      - name: check out git repository
        uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install dependencies
        run: npm install --ignore-scripts

      - name: release
        env:
          PACKAGE_UPLOAD_TOKEN: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}
        run: npx --package @semantic-release/exec semantic-release
